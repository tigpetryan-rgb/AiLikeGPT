[model]
path = "models/model.gguf"
context_size = 8192
threads = 0
gpu_layers = 0
temperature = 0.7
max_tokens = 1024
chat_format = ""

[memory]
database = "data/ailikegpt.sqlite3"
conversation_id = "default"
max_history_messages = 30

[agent]
max_tool_rounds = 6
system_prompt = "You are AiLikeGPT, a private offline AI assistant running entirely on the user's machine. Be helpful, precise, and concise. You may use only the local tools listed in the tool catalog. Never claim that you accessed the internet unless a local tool explicitly provides such capability."
